name: Prosper images

# Builds the Prosper-branded images to ghcr.io/lukehoefs/prosper-keeper.
# The upstream docker-publish.yml needs the private keeperdotsh/seo submodule; this one
# builds without it (marketing pages fall back to default copy, which we don't use).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 2.28.8-prosper.1)"
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/prosper-keeper

jobs:
  build:
    if: github.repository == 'lukehoefs/prosper-keeper'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services   # api + cron + worker + web in one container (s6)
            dockerfile: docker/services/Dockerfile
            suffix: ""
          - name: standalone # services + postgres + redis + caddy
            dockerfile: docker/standalone/Dockerfile
            suffix: "-standalone"
          - { name: api, dockerfile: services/api/Dockerfile, suffix: "-api" }
          - { name: cron, dockerfile: services/cron/Dockerfile, suffix: "-cron" }
          - { name: worker, dockerfile: services/worker/Dockerfile, suffix: "-worker" }
          - { name: web, dockerfile: applications/web/Dockerfile, suffix: "-web" }
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}${{ matrix.suffix }}
            ${{ env.IMAGE }}:latest${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/lukehoefs/prosper-keeper
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
